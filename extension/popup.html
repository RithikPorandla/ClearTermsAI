<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClearTerms AI</title>
  <link rel="stylesheet" href="styles/popup.css" />
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="brand">
        <div class="logo">CT</div>
        <div>
          <div class="title">ClearTerms AI</div>
          <div class="subtitle">Policy Risk Scanner</div>
        </div>
      </div>
      <button id="open-options" class="ghost">Settings</button>
    </header>

    <section class="hero-card" aria-live="polite">
      <div class="meter" id="risk-meter">
        <div class="score" id="risk-score">--</div>
        <div class="label" id="risk-level">Scanning…</div>
      </div>
      <div class="summary">
        <div class="summary-title">Executive Summary</div>
        <p id="gist">We'll summarize the policy once analyzed.</p>
      </div>
    </section>

    <section class="flags">
      <div class="section-title">Red Flags</div>
      <ul id="flags-list" class="flag-list"></ul>
    </section>

    <section class="actions">
      <button id="analyze" class="primary">Analyze This Policy</button>
      <button id="view-report" class="secondary" disabled>Full Report →</button>
    </section>

    <section id="status" class="status"></section>
    <section class="disclaimer">
      Not legal advice · Evidence-first · Local-first
    </section>
  </main>

  <script src="scripts/popup.js"></script>
</body>
</html>
